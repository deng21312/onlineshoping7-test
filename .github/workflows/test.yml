name: Gitee代码端到端CI测试

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 拉取Gitee仓库
        run: |
          git clone https://gitee.com/ZhiheZier_0719/online-shopping-system.git --branch dev project

      - name: 设置Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 设置Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建后端
        working-directory: ./project/backend
        run: |
          ./mvnw clean package -DskipTests

      - name: 启动后端
        working-directory: ./project/backend
        run: |
          nohup java -jar target/*.jar &
          sleep 30

      - name: 构建并启动前端
        working-directory: ./project/frontend/vue-onlineshopping
        run: |
          npm install
          nohup npm run dev -- --host 0.0.0.0 &
          sleep 20

      - name: 安装Cypress
        run: npm install cypress

      - name: 运行Cypress测试
        working-directory: ./project/frontend/vue-onlineshopping
        run: npx cypress run