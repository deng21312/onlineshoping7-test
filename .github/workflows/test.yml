name: 稳定版：前端构建 + 后端启动 + Cypress测试
on:
  workflow_dispatch:

jobs:
  stable-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlineshopping
        ports:
          - 3306:3306

    steps:
      - name: 克隆代码
        run: git clone https://gitee.com/ZhiheZier_0719/online-shopping-system.git --branch dev project

      - name: 导入数据库
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h127.0.0.1 -uroot -proot onlineshopping < project/onlineshopping.sql

      # ========== 启动后端 ==========
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: 启动后端
        run: |
          cd project/backend
          chmod +x mvnw
          ./mvnw spring-boot:run &
          sleep 80

      # ========== 前端：构建生产版本（不会失败！） ==========
      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建前端并启动静态服务
        run: |
          cd project/frontend/vue-onlineshopping
          npm install
          npm run build
          npm install -g serve
          serve -s dist -l 5173 &
          sleep 15

      # ========== 测试是否启动 ==========
      - name: 测试前端
        run: curl http://localhost:5173

      # ========== 运行 Cypress ==========
      - name: 拉取测试代码
        uses: actions/checkout@v4
        with:
          path: cypress-test

      - name: 运行测试
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-test
          command: npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:5173