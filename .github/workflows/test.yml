name: 仅测试 - 拉取Gitee代码

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]

jobs:
  test-only:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 Gitee 项目代码
        uses: actions/checkout@v4
        with:
          repository: ZhiheZier_0719/online-shopping-system
          ref: dev
          token: ${{ secrets.GITEE_TOKEN }}
          path: project