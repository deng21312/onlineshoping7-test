name: 完整CI：拉取Gitee → 部署前后端 → Cypress测试
on:
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlineshopping
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 克隆 Gitee 商城代码
        run: |
          git clone https://gitee.com/ZhiheZier_0719/online-shopping-system.git --branch dev project

      - name: 导入数据库
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h127.0.0.1 -uroot -proot onlineshopping < project/onlineshopping.sql

      - name: 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: 启动后端
        run: |
          cd project/backend
          chmod +x mvnw
          ./mvnw spring-boot:run > backend.log 2>&1 &
          sleep 80

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 启动前端（固定端口 8080）
        run: |
          cd project/frontend/vue-onlineshopping
          npm install
          npm run dev -- --port 8080 > frontend.log 2>&1 &
          sleep 60

      - name: 测试前端是否真的启动
        run: |
          curl --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080
          echo "前端服务已正常启动"

      - name: 拉取 Cypress 测试代码
        uses: actions/checkout@v4
        with:
          path: cypress-test

      - name: 运行 Cypress 测试
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-test
          command: npx cypress run
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8080