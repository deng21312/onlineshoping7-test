name: 终极完整版：前后端部署 + Cypress测试
on:
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlineshopping
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 克隆 Gitee 代码
        run: |
          git clone https://gitee.com/ZhiheZier_0719/online-shopping-system.git --branch dev project

      - name: 初始化数据库
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h127.0.0.1 -uroot -proot onlineshopping < project/onlineshopping.sql

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 启动后端 SpringBoot 3
        run: |
          cd project/backend
          chmod +x mvnw
          ./mvnw spring-boot:run &
          sleep 80

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔥 修复 rollup 依赖 bug 的关键步骤
      - name: 启动 Vite 前端
        run: |
          cd project/frontend/vue-onlineshopping
          npm install @rollup/rollup-linux-x64-gnu --force
          npm install
          npm run dev &
          sleep 60
        shell: bash

      - name: 测试前端是否可用
        run: curl --retry 10 --retry-delay 3 http://127.0.0.1:5173

      - name: 拉取 Cypress 代码
        uses: actions/checkout@v4
        with:
          path: cypress-test

      - name: 运行自动化测试
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-test
          command: npx cypress run
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173