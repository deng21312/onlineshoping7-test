name: 最终修复版：前后端部署 + Cypress测试
on:
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlineshopping
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --host=127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 克隆 Gitee 代码
        run: |
          git clone https://gitee.com/ZhiheZier_0719/online-shopping-system.git --branch dev project

      # 关键步骤：等待MySQL完全就绪
      - name: 等待MySQL服务启动
        run: until mysql -h127.0.0.1 -uroot -proot -e "SELECT 1"; do sleep 5; done

      - name: 初始化数据库
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h127.0.0.1 -uroot -proot onlineshopping < project/onlineshopping.sql

      - name: 设置 Java 17 + Maven 3.9.9
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          maven-version: 3.9.9

      - name: 启动后端 SpringBoot 3
        run: |
          cd project/backend
          # 修改application.yml强制使用127.0.0.1
          sed -i 's/localhost/127.0.0.1/g' src/main/resources/application.yml
          chmod +x mvnw
          ./mvnw spring-boot:run &
          sleep 90

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 启动 Vite 前端
        run: |
          cd project/frontend/vue-onlineshopping
          npm install @rollup/rollup-linux-x64-gnu --force
          npm install
          npm run dev -- --host 0.0.0.0 &
          sleep 60
        shell: bash

      - name: 测试前端
        run: curl --retry 10 --retry-delay 3 http://localhost:5173

      - name: 拉取 Cypress 代码
        uses: actions/checkout@v4
        with:
          path: cypress-test

      - name: 运行 Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-test
          command: npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:5173