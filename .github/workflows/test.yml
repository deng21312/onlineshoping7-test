name: 完整CI：拉取Gitee → 部署前后端 → Cypress测试
on:
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlineshopping
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 1. 拉取 Gitee 代码
      - name: 克隆 Gitee 商城代码
        run: |
          git clone https://gitee.com/ZhiheZier_0719/online-shopping-system.git --branch dev project

      # 2. 安装 Java 11
      - name: 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      # 3. 启动后端 SpringBoot
      - name: 启动后端服务
        run: |
          cd project/backend
          chmod +x mvnw
          ./mvnw spring-boot:run &
          sleep 40
        shell: bash

      # 4. 安装 Node.js 20
      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 5. 启动前端 Vue
      - name: 启动前端服务
        run: |
          cd project/frontend/vue-onlineshopping
          npm install
          npm run dev &
          sleep 25
        shell: bash

      # 6. 运行 Cypress 测试
      - name: 拉取 Cypress 测试代码
        uses: actions/checkout@v4
        with:
          path: cypress-test

      - name: 运行自动化测试
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-test
          command: npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:5173