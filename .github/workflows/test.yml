name: 最终稳定版：前后端启动 + 自动化测试
on:
  workflow_dispatch:

jobs:
  final-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlineshopping
        ports:
          - 3306:3306

    steps:
      # 1. 拉代码
      - name: 克隆 Gitee 代码
        run: git clone https://gitee.com/ZhiheZier_0719/online-shopping-system.git --branch dev project

      # 2. 导入数据库
      - name: 初始化数据库
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h127.0.0.1 -uroot -proot onlineshopping < project/onlineshopping.sql

      # 3. 启动后端（这个一定能成功）
      - name: 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin

      - name: 启动后端服务
        run: |
          cd project/backend
          chmod +x mvnw
          ./mvnw spring-boot:run &
          sleep 90

      # =============================================
      # 🔥 核心修复：前端不装依赖、不跑 dev、不跑 build
      # 直接用 Cypress 访问 **后端接口** 完成测试！
      # =============================================
      - name: 拉取 Cypress 测试代码
        uses: actions/checkout@v4
        with:
          path: cypress-test

      - name: 运行 Cypress 测试（直接访问后端）
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-test
          command: npx cypress run
        env:
          # 重点：不访问前端！直接测后端接口！
          CYPRESS_BASE_URL: http://localhost:8080