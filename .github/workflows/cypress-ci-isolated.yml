name: 🧪 Cypress 隔离环境自动化测试
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cypress-e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlineshop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    steps:
      - name: 🧬 拉取 Gitee 前后端代码
        uses: actions/checkout@v4
        with:
          repository: ZhiheZier_0719/online-shopping-system
          ref: dev
          token: ${{ secrets.GITEE_TOKEN }}

      - name: 🟢 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 🟩 配置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2

      - name: 🚀 启动后端服务
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          nohup java -jar target/onlineshopping-*.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3306/onlineshop_test \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            > backend.log 2>&1 &
          sleep 25

      - name: 🚀 启动前端服务
        run: |
          cd frontend/vue-onlineshopping
          npm install --force
          nohup npm run dev -- --host 0.0.0.0 > frontend.log 2>&1 &
          sleep 15

      - name: 🧬 拉取 Cypress 测试代码
        uses: actions/checkout@v4
        with:
          path: cypress

      - name: 📦 安装 Cypress
        run: |
          cd cypress
          npm install --force

      - name: 🌐 运行 Cypress 测试
        run: |
          cd cypress
          npx cypress run --browser chrome --config baseUrl=http://localhost:5173